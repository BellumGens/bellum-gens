# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: echo "@infragistics:registry=https://packages.infragistics.com/npm/js-licensed/" >> ~/.npmrc
    - run: echo "//packages.infragistics.com/npm/js-licensed/:_auth=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
    - run: echo "//packages.infragistics.com/npm/js-licensed/:always-auth=true" >> ~/.npmrc
    - run: npm ci
    - run: npm run lint
    - name: Build
      run: npm run build
    - run: npm run test:prod -- --coverage
    - name: Merge coverage
      run: npm run coverage:merge
    - name: Publish to coveralls.io
      uses: coverallsapp/github-action@v2.3.8
      with:
        github-token: ${{ github.token }}
        file: coverage/lcov.info
    - name: Cypress run
      uses: cypress-io/github-action@v6.10.4
      with:
        start: npm run serve:ssr:bellumgens
        browser: chrome
