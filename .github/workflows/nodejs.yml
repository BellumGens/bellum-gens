# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Only the e2e job needs the Cypress binary
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        npm-token: ${{ secrets.NPM_TOKEN }}
    - run: npm run lint

  # The apps resolve the common library from source, so none of the builds depend on each other
  build:
    runs-on: ubuntu-latest
    # Only the e2e job needs the Cypress binary
    env:
      CYPRESS_INSTALL_BINARY: 0
    strategy:
      matrix:
        project: [bellum-gens-common, bellum-gens, eb-league]
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        npm-token: ${{ secrets.NPM_TOKEN }}
    - run: npx ng build ${{ matrix.project }} --configuration production
    - name: Upload app build for e2e
      if: matrix.project != 'bellum-gens-common'
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.project }}
        path: dist/
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    # Only the e2e job needs the Cypress binary
    env:
      CYPRESS_INSTALL_BINARY: 0
    strategy:
      matrix:
        project: [bellum-gens-common, bellum-gens, eb-league]
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        npm-token: ${{ secrets.NPM_TOKEN }}
    - run: npx ng test ${{ matrix.project }} --watch=false --no-progress --coverage
    - name: Upload coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.project }}
        path: coverage/
        retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: test
    # Only the e2e job needs the Cypress binary
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        npm-token: ${{ secrets.NPM_TOKEN }}
    - name: Download coverage
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        path: coverage
        merge-multiple: true
    - name: Merge coverage
      run: npm run coverage:merge
    - name: Publish to coveralls.io
      uses: coverallsapp/github-action@v2.3.8
      with:
        github-token: ${{ github.token }}
        file: coverage/lcov.info

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        npm-token: ${{ secrets.NPM_TOKEN }}
    - name: Download app builds
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Cypress run
      uses: cypress-io/github-action@v7.4.6
      env:
        # The production builds only allow their public hosts; let the SSR servers answer localhost
        NG_ALLOWED_HOSTS: localhost
      with:
        install: false
        start: npm run serve:ssr:bellumgens, npm run serve:ssr:ebleague
        wait-on: 'http://localhost:4000, http://localhost:4001'
        browser: chrome
