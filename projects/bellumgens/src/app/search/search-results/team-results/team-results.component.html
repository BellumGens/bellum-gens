@if (loading()) {
  <bg-loading>
  </bg-loading>
}
@else {
  <div class="card-wrapper">
    <div class="content-container-row">
      <h4 igxCardHeaderTitle i18n>Found <span class="highlight">{{teams()?.length }}</span> results for teams{{ query() | queryParsed }}</h4>
    </div>
    @for (team of teams(); track team.teamId) {
      <igx-card class="result-card" elevated>
        <igx-card-header>
          <igx-avatar igxCardThumbnail [src]="team.teamAvatar" [initials]="team.teamName" [size]="'medium'" shape="circle"></igx-avatar>
          <h3 igxCardHeaderTitle>
            <!-- The link covers the whole card, so the card stays clickable everywhere -->
            <a class="card-link" [routerLink]="['/team', team.customUrl]">{{ team.teamName }}</a>
          </h3>
        </igx-card-header>
        <igx-card-content>
          <div>{{ team.description }}</div>
        </igx-card-content>
      </igx-card>
    }
  </div>
}
